name: Build Android APK

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6

    - name: Set up Node.js Environment
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Set up Java JDK 17 (Native)
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

    - name: Prepare Web Assets & Install Dependencies
      run: |
        npm install
        mkdir www
        mv index.html www/
        npx cap init "PDF Vault" "com.pdfvault.app" --web-dir=www

    - name: Add Android Platform Wrapper
      run: |
        npx cap add android
        npx cap sync android

    - name: Compile Source Code to Android APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Vault-Mobile-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
