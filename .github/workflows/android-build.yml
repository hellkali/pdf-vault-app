name: Build Android APK

on:
  push:
    branches: [ "main" ]

# Explicitly opt-in directly at the project root to silence intermediate checker alerts
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Upgraded to v6 to completely clear structural Node 20 metadata flags
    - name: Checkout Source Code
      uses: actions/checkout@v6

    - name: Set up Node.js Environment
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Project Dependencies
      run: |
        npm install
        npx cap init "PDF Vault" "com.pdfvault.app" --web-dir=.

    - name: Add Android Platform Wrapper
      run: |
        npx cap add android
        npx cap sync android

    - name: Compile Source Code to Android APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Vault-Mobile-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
