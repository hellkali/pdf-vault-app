name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Upgraded to the native Node 24 targeting versions
    - name: Checkout Source Code
      uses: actions/checkout@v4.2.2

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4.2.0
      with:
        node-version: 22

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4.4.0
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Project Dependencies
      run: |
        npm install
        npx cap init "PDF Vault" "com.pdfvault.app" --web-dir=.

    - name: Add Android Platform Wrapper
      run: |
        npx cap add android
        npx cap sync android

    - name: Compile Source Code to Android APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Vault-Mobile-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
